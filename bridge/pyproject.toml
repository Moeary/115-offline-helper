[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "115-offline-helper-bridge"
version = "0.1.0"
description = "Local FastAPI bridge for 115 Offline Helper"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["bridge", "bridge.providers"]
package-dir = {"bridge" = ".", "bridge.providers" = "providers"}

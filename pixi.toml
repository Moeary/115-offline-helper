[workspace]
name = "115-offline-helper"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
httpx = ">=0.27,<1"
beautifulsoup4 = ">=4.12,<5"
pytest = ">=8,<10"

[tasks]
build = "python scripts/build.py"
deploy = "python scripts/deploy.py"
clean = "python scripts/clean.py"
bridge-token = { cmd = "python -m bridge.main --print-token", cwd = "src/fastapi-bridge" }
bridge-start = { cmd = "python -m bridge.main", cwd = "src/fastapi-bridge" }
bridge-test = { cmd = "python -m pytest -q tests --basetemp=.pytest-tmp", cwd = "src/fastapi-bridge" }

[workspace]
name = "115-offline-helper"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
httpx = ">=0.27,<1"
beautifulsoup4 = ">=4.12,<5"
pytest = ">=8,<10"

[tasks]
build = "python scripts/build.py"
deploy = "python scripts/deploy.py"
clean = "python scripts/clean.py"
# Keep Python bytecode, pytest's cache, and temporary test trees together
# under the repository cache directory instead of scattering dot-folders in
# the Bridge source tree.
bridge-token = { cmd = "python -m bridge.main --print-token", cwd = "src/fastapi-bridge", env = { PYTHONPYCACHEPREFIX = "../../.cache/pixi/pycache" } }
bridge-pair = { cmd = "python -m bridge.main --pair", cwd = "src/fastapi-bridge", env = { PYTHONPYCACHEPREFIX = "../../.cache/pixi/pycache" } }
bridge-start = { cmd = "python -m bridge.main", cwd = "src/fastapi-bridge", env = { PYTHONPYCACHEPREFIX = "../../.cache/pixi/pycache" } }
bridge-test = { cmd = "python -m pytest -q tests -o cache_dir=../../.cache/pixi/pytest --basetemp=../../.cache/pixi/pytest-tmp", cwd = "src/fastapi-bridge", env = { PYTHONPYCACHEPREFIX = "../../.cache/pixi/pycache" } }
